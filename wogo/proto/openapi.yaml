info: {}
paths:
  /v1/fs/copy:
    post:
      tags:
        - wode.fs.v1.FileSystemService
      summary: Copy
      description: Copy a file or directory
      operationId: wode.fs.v1.FileSystemService.Copy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wode.fs.v1.CopyRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wode.fs.v1.CopyResponse'
  /v1/fs/exists:
    get:
      tags:
        - wode.fs.v1.FileSystemService
      summary: Exists
      description: Check if a path exists
      operationId: wode.fs.v1.FileSystemService.Exists
      parameters:
        - name: path
          in: query
          description: Path to check
          schema:
            type: string
            title: path
            description: Path to check
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wode.fs.v1.ExistsResponse'
  /v1/fs/mkdir:
    post:
      tags:
        - wode.fs.v1.FileSystemService
      summary: Mkdir
      description: Create a directory
      operationId: wode.fs.v1.FileSystemService.Mkdir
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wode.fs.v1.MkdirRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wode.fs.v1.MkdirResponse'
  /v1/fs/readFile:
    post:
      tags:
        - wode.fs.v1.FileSystemService
      summary: ReadFile
      description: Read file contents
      operationId: wode.fs.v1.FileSystemService.ReadFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wode.fs.v1.ReadFileRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wode.fs.v1.ReadFileResponse'
  /v1/fs/readdir:
    post:
      tags:
        - wode.fs.v1.FileSystemService
      summary: Readdir
      description: List directory contents
      operationId: wode.fs.v1.FileSystemService.Readdir
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wode.fs.v1.ReaddirRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wode.fs.v1.ReaddirResponse'
  /v1/fs/remove:
    post:
      tags:
        - wode.fs.v1.FileSystemService
      summary: Remove
      description: Remove a file or directory
      operationId: wode.fs.v1.FileSystemService.Remove
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wode.fs.v1.RemoveRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wode.fs.v1.RemoveResponse'
  /v1/fs/rename:
    post:
      tags:
        - wode.fs.v1.FileSystemService
      summary: Rename
      description: Rename a file or directory
      operationId: wode.fs.v1.FileSystemService.Rename
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wode.fs.v1.RenameRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wode.fs.v1.RenameResponse'
  /v1/fs/stat:
    get:
      tags:
        - wode.fs.v1.FileSystemService
      summary: Stat
      description: Get file or directory status
      operationId: wode.fs.v1.FileSystemService.Stat
      parameters:
        - name: path
          in: query
          description: File or directory path
          schema:
            type: string
            title: path
            description: File or directory path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wode.fs.v1.StatResponse'
