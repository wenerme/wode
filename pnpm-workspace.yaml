packages:
- 'apps/*'
- 'packages/*'
- 'components/*'
- wode-assistant/frontend

onlyBuiltDependencies:
- '@swc/core'
- argon2
- bcrypt
- better-sqlite3
- canvas
- esbuild
- sharp

ignoredOptionalDependencies:
- fsevents

patchedDependencies:
  ts-node@11.0.0-beta.1: patches/ts-node.patch

minimumReleaseAge: 600
minimumReleaseAgeExclude:
- "@wener/*"
- "@vitejs/*"
- vite
- react

strictPeerDependencies: false
linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false
dedupeDirectDeps: true

# Package version overrides
packageExtensions:
  dotenv:
    peerDependencies:
      "@types/node": "*"

# Override dotenv version across the entire workspace
overrides:
  dotenv: ^16.4.5
