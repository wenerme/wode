packages:
  - 'apps/*'
  - 'packages/*'
  - 'components/*'

onlyBuiltDependencies:
- '@swc/core'
- argon2
- bcrypt
- better-sqlite3
- canvas
- esbuild
- sharp

patchedDependencies:
  ts-node@11.0.0-beta.1: patches/ts-node.patch


linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false
dedupeDirectDeps: true

minimumReleaseAge: 600
minimumReleaseAgeExclude:
- "@wener/*"
- "@vitejs/*"
- vite

strictPeerDependencies: false
