version: v2
modules:
- path: proto
  lint:
    except:
    - FILE_LOWER_SNAKE_CASE
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    disallow_comment_ignores: true
  breaking:
    use:
    - FILE
    except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT

deps:
- buf.build/googleapis/googleapis
