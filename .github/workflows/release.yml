name: Release packages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 12.18.0

jobs:
  select-mode:
    name: Select release mode
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Select release mode
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Create or update version PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or update version PR
        uses: changesets/action/version@v2.1.2
        with:
          github-token: ${{ github.token }}
          script: pnpm version:packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          pr-base-branch: develop

  pack:
    name: Build and pack release artifacts
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.38.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace
        run: pnpm build

      - name: Download publish plan
        uses: actions/download-artifact@v6.0.0
        with:
          artifact-ids: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}
          path: .changeset/publish-plan

      - name: Require a single package per release
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const root = '.changeset/publish-plan';
          const files = fs.readdirSync(root, { withFileTypes: true, recursive: true })
            .filter((entry) => entry.isFile() && entry.name === 'publish-plan.json')
            .map((entry) => `${entry.path}/${entry.name}`);
          if (files.length !== 1) {
            throw new Error(`Expected one publish-plan.json under ${root}, found ${files.length}`);
          }
          const plan = JSON.parse(fs.readFileSync(files[0], 'utf8'));
          if (!Number.isInteger(plan.version) || !Array.isArray(plan.plan)) {
            throw new Error('Invalid Changesets publish plan shape');
          }
          const packages = plan.plan.map(({ name, version }) => `${name}@${version}`);
          if (packages.length !== 1) {
            throw new Error(`Expected exactly one package in the release plan, got: ${packages.join(', ') || '(none)'}`);
          }
          console.log(`Release plan: ${packages[0]}`);
          NODE

      - name: Pack publishable packages
        id: pack
        uses: changesets/action/pack@v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish packages with npm Trusted Publishing
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish packed packages
        uses: changesets/action/publish@v2.1.2
        with:
          github-token: ${{ github.token }}
          script: pnpm release
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
          push-git-tags: true
